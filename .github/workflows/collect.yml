name: collect

# 설계 문서 §9. KST 21:00~03:00 에만 20분 간격으로 수집 (하루 19회). 낮에는 경기가 없어 수집하지 않는다 — 필요하면 수동 실행.  — 2026-10-10
# cron 은 UTC. 정각을 피해 3·23·43분 (GitHub 가 정각 부근 스케줄을 지연·누락시키는 경우가 있음).
# 원칙: 새 경기(또는 시즌 누적·실패 상태 변화)가 없으면 커밋도 배포도 없다. 실행 시각은 저장소에 쓰지 않는다.
on:
  schedule:
    - cron: '3,23,43 12-17 * * *'         # UTC 12:03~17:43 = KST 21:03~02:43, 20분 간격
    - cron: '3 18 * * *'                  # UTC 18:03 = KST 03:03, 밤 세션 마감 1회
  workflow_dispatch:                   # 수동 실행

concurrency:
  group: collect
  cancel-in-progress: false            # 겹치면 기다렸다가 순서대로

permissions:
  contents: write                      # raw/meta/docs 커밋
  pages: write                         # Pages 배포
  id-token: write                      # Pages 배포(OIDC)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect new matches            # 표준 라이브러리만 사용 (pip install 없음)
        id: collect
        run: python collect.py

      - name: Build site data
        run: python build.py

      - name: Keepalive                      # 공개 저장소는 60일간 커밋이 없으면 스케줄이 꺼진다 → 50일 넘으면 표식 파일 갱신
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((50*24*3600)) ]; then
            date -u +%F > meta/keepalive.txt
            echo "keepalive: last commit older than 50 days, touching meta/keepalive.txt"
          fi

      - name: Commit & push (only if something changed)
        id: commit
        run: |
          git config user.name  'collector-bot'
          git config user.email 'collector-bot@users.noreply.github.com'
          git add raw meta docs
          if git diff --cached --quiet; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "no changes — nothing committed"
            exit 0
          fi
          if git diff --cached --quiet -- docs; then docs_changed=false; else docs_changed=true; fi
          git commit -m "collect $(date -u +%FT%TZ) (+${{ steps.collect.outputs.new_matches || 0 }} matches)"
          git push
          echo "deploy=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "committed · docs changed: $docs_changed"

      - name: Upload Pages artifact
        if: steps.commit.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    if: needs.collect.outputs.deploy == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
