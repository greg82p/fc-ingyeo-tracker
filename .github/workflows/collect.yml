name: collect

# 설계 문서 §9. 수동 실행(workflow_dispatch) 전용.
# 2026-10-14: GitHub `schedule` 은 best effort 라 대부분 누락·수시간 지연되어(10/11~13 기대 57회 중 8회, 최대 6시간 지연) 제거했다.
#             당분간 수동 실행하고, 이후 외부 트리거(tools/cf-dispatcher 의 Cloudflare Cron → workflow_dispatch)로 바꾼다.
# 원칙: 새 경기(또는 시즌 누적·실패 상태 변화)가 없으면 커밋도 배포도 없다. 실행 시각은 저장소에 쓰지 않는다.
on:
  workflow_dispatch:                   # 수동 실행 · 외부 트리거(Cloudflare 등)도 이 이벤트를 쓴다

concurrency:
  group: collect
  cancel-in-progress: false            # 겹치면 기다렸다가 순서대로

permissions:
  contents: write                      # raw/meta/docs 커밋
  pages: write                         # Pages 배포
  id-token: write                      # Pages 배포(OIDC)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect new matches            # 표준 라이브러리만 사용 (pip install 없음)
        id: collect
        run: python collect.py

      - name: Build site data
        run: python build.py

      - name: Commit & push (only if something changed)
        id: commit
        run: |
          git config user.name  'collector-bot'
          git config user.email 'collector-bot@users.noreply.github.com'
          git add raw meta docs
          if git diff --cached --quiet; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "no changes — nothing committed"
            exit 0
          fi
          if git diff --cached --quiet -- docs; then docs_changed=false; else docs_changed=true; fi
          git commit -m "collect $(date -u +%FT%TZ) (+${{ steps.collect.outputs.new_matches || 0 }} matches)"
          git push
          echo "deploy=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "committed · docs changed: $docs_changed"

      - name: Upload Pages artifact
        if: steps.commit.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    if: needs.collect.outputs.deploy == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
